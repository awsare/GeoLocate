<html>
    <head>
        <title>GeoLocate</title>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                background: #e8eef6;
                font-family: Arial, sans-serif;
            }

            .side-panel {
                width: 15%;
                min-width: 120px;
                background: #1f364f;
            }

            .center-panel {
                flex: 1;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 40px 20px;
            }

            .content-card {
                width: 100%;
                max-width: 720px;
                background: #ffffff;
                border-radius: 24px;
                padding: 32px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
            }

            h1,
            h2 {
                margin: 0;
                color: #162339;
                text-align: center;
            }

            h2 {
                margin-top: 32px;
            }

            p {
                color: #444d5c;
                line-height: 1.6;
                text-align: center;
            }

            form {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 16px;
                margin-top: 24px;
            }

            input[type="file"] {
                width: 100%;
                max-width: 400px;
            }

            button {
                border: none;
                border-radius: 10px;
                background: #1f364f;
                color: #ffffff;
                padding: 14px 28px;
                font-size: 1rem;
                cursor: pointer;
                transition: background 0.2s ease;
            }

            button:hover {
                background: #304a74;
            }

            #results {
                margin-top: 20px;
                background: #f5f8fc;
                border: 1px solid #d8e1ef;
                border-radius: 18px;
                padding: 24px;
                min-height: 160px;
            }

            #results p {
                text-align: left;
                margin: 0;
            }
        </style>
    </head>
    <body>
        <div class="side-panel"></div>
        <main class="center-panel">
            <section class="content-card">
                <h1>GeoLocate</h1>
                <p>Welcome to GeoLocate! This application allows you to upload an image and get its geographical location.</p>
                <form action="/upload" method="post" enctype="multipart/form-data">
                    <input id="fileInput" type="file" name="image" accept="image/*" required>
                    <button id="uploadBtn" type="button">Upload Image</button>
                </form>
                <h2>Results</h2>
                <div id="results">
                    <p>No results yet. Upload an image to see the closest sectors.</p>
                </div>
            </section>
        </main>
        <div class="side-panel"></div>
        <script>
            const uploadBtn = document.getElementById('uploadBtn');
            const fileInput = document.getElementById('fileInput');
            const results = document.getElementById('results');

            uploadBtn.addEventListener('click', async () => {
                if (!fileInput.files || fileInput.files.length === 0) return alert('Select an image first');
                const fd = new FormData();
                fd.append('image', fileInput.files[0]);
                fd.append('topk', '3');

                results.innerHTML = '<p>Uploading and computing results…</p>';
                try {
                    const resp = await fetch('/predict', {method: 'POST', body: fd});
                    if (!resp.ok) throw new Error(await resp.text());
                    const data = await resp.json();
                    renderResults(data);
                } catch (err) {
                    results.innerHTML = '<p style="color:crimson">Error: ' + err.message + '</p>';
                }
            });

            function renderResults(data) {
                let html = '';
                if (data.predictions) {
                    html += '<h3>Top Predictions</h3><ul>';
                    for (const p of data.predictions) {
                        html += `<li><strong>${p.sector}</strong> — ${ (p.score*100).toFixed(1) }%</li>`;
                    }
                    html += '</ul>';
                }

                if (data.neighbors) {
                    html += '<h3>Nearest Training Examples</h3><div style="display:flex;gap:12px;flex-wrap:wrap">';
                    for (const n of data.neighbors) {
                        html += '<div style="width:160px;text-align:center">';
                        if (n.thumbnail) html += `<img src="${n.thumbnail}" style="width:160px;height:160px;object-fit:cover;border-radius:8px;display:block;margin:0 auto 8px;">`;
                        html += `<div style="font-size:0.9rem">${n.sector}</div>`;
                        html += `<div style="color:#666;font-size:0.8rem">dist ${(n.distance).toFixed(3)}</div>`;
                        html += '</div>';
                    }
                    html += '</div>';
                }

                results.innerHTML = html;
            }
        </script>
    </body>
</html>

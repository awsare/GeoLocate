<html>
    <head>
        <title>GeoLocate</title>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                background-image: url('/static/background.jpg');
                background-size: cover;
                background-attachment: fixed;
                background-position: center;
                background-repeat: no-repeat;
                background-color: transparent;
                font-family: Arial, sans-serif;
            }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.28);
                pointer-events: none;
                z-index: 0;
            }

            .side-panel {
                width: 15%;
                min-width: 120px;
                background: transparent;
            }

            .center-panel {
                flex: 1;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 40px 20px;
                min-height: 100vh;
                box-sizing: border-box;
                position: relative;
                z-index: 1;
            }

            .content-card {
                width: 100%;
                max-width: 820px;
                background: #ffffff;
                border-radius: 12px;
                padding: 20px 28px;
                box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
                border: 1px solid rgba(0,0,0,0.06);
                height: calc(100vh - 80px);
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                position: relative;
                z-index: 2;
            }

            .panel-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin-bottom: 12px;
            }

            .controls {
                display: flex;
                gap: 8px;
                align-items: center;
            }

            .btn {
                padding: 10px 16px;
                border-radius: 10px;
                border: none;
                cursor: pointer;
                font-weight: 600;
            }

            .btn-primary {
                background: #1f364f;
                color: #fff;
            }

            .btn-secondary {
                background: rgba(31,54,79,0.08);
                color: #1f364f;
            }

            .info-block {
                display: flex;
                gap: 18px;
                align-items: center;
                font-size: 0.95rem;
                color: #162339;
            }

            h1,
            h2 {
                margin: 0;
                color: #162339;
            }

            h2 {
                margin-top: 32px;
            }

            p {
                color: #444d5c;
                line-height: 1.6;
                text-align: center;
            }

            form {
                display: flex;
                gap: 12px;
                align-items: center;
                margin: 0;
            }

            input[type="file"] {
                display: inline-block;
            }

            button {
                border: none;
                border-radius: 10px;
                background: #1f364f;
                color: #ffffff;
                padding: 14px 28px;
                font-size: 1rem;
                cursor: pointer;
                transition: background 0.2s ease;
            }

            button:hover {
                background: #304a74;
            }

            #results {
                margin-top: 16px;
                background: rgba(245, 248, 252, 0.9);
                border: 1px solid rgba(216,225,239,0.7);
                border-radius: 12px;
                padding: 18px;
                min-height: 160px;
            }

            #results p {
                text-align: left;
                margin: 0;
            }
        </style>
    </head>
    <body>
        <div class="side-panel"></div>
        <main class="center-panel">
            <section class="content-card">
                <div class="panel-header">
                    <div>
                        <h1>GeoLocate</h1>
                        <div class="info-block">
                            <div>Model: <strong>ResNet</strong></div>
                        </div>
                    </div>

                    <div class="controls">
                        <button id="clearBtn" class="btn btn-secondary" type="button">Clear</button>
                    </div>
                </div>

                <p style="margin-top:8px;">Upload an image (Street View style) and the model will predict the most likely geographic sectors.</p>
                <div style="margin-top:18px;display:flex;justify-content:center;gap:12px;align-items:center;">
                    <form id="uploadForm" action="/upload" method="post" enctype="multipart/form-data">
                        <input id="fileInput" type="file" name="image" accept="image/*" required>
                        <button id="uploadBtn" class="btn btn-primary" type="button">Upload</button>
                    </form>
                </div>

                <div class="preview" style="margin-top:12px;display:flex;justify-content:center;">
                    <img id="previewImg" src="" alt="Preview" style="max-width:420px;max-height:320px;border-radius:8px;object-fit:cover;box-shadow:0 8px 24px rgba(0,0,0,0.25);display:none;" />
                </div>

                <h2 style="margin-top:20px;">Results</h2>
                <div id="results" style="margin-top:8px;">
                    <p>No results yet. Upload an image to see the closest sectors.</p>
                </div>
            </section>
        </main>
        <div class="side-panel"></div>
        <script>
            const uploadBtn = document.getElementById('uploadBtn');
            const fileInput = document.getElementById('fileInput');
            const results = document.getElementById('results');
            const clearBtn = document.getElementById('clearBtn');
            const previewImg = document.getElementById('previewImg');
            let previewUrl = null;

            clearBtn.addEventListener('click', () => {
                fileInput.value = '';
                // revoke preview URL if present
                if (previewUrl) {
                    URL.revokeObjectURL(previewUrl);
                    previewUrl = null;
                }
                if (previewImg) {
                    previewImg.src = '';
                    previewImg.style.display = 'none';
                }
                results.innerHTML = '<p>No results yet. Upload an image to see the closest sectors.</p>';
            });

            fileInput.addEventListener('change', () => {
                if (!fileInput.files || fileInput.files.length === 0) {
                    if (previewUrl) {
                        URL.revokeObjectURL(previewUrl);
                        previewUrl = null;
                    }
                    if (previewImg) previewImg.style.display = 'none';
                    return;
                }
                const file = fileInput.files[0];
                if (previewUrl) URL.revokeObjectURL(previewUrl);
                previewUrl = URL.createObjectURL(file);
                if (previewImg) {
                    previewImg.src = previewUrl;
                    previewImg.style.display = 'block';
                }
            });

            uploadBtn.addEventListener('click', async () => {
                if (!fileInput.files || fileInput.files.length === 0) return alert('Select an image first');
                const fd = new FormData();
                fd.append('image', fileInput.files[0]);
                fd.append('topk', '3');

                results.innerHTML = '<p>Uploading and computing results…</p>';
                try {
                    const resp = await fetch('/predict', {method: 'POST', body: fd});
                    if (!resp.ok) throw new Error(await resp.text());
                    const data = await resp.json();
                    // If server returns sector count, display it in header
                    if (data.sector_count) {
                        const sc = document.getElementById('sectorCount');
                        if (sc) sc.textContent = data.sector_count;
                    }
                    renderResults(data);
                } catch (err) {
                    results.innerHTML = '<p style="color:crimson">Error: ' + err.message + '</p>';
                }
            });

            function renderResults(data) {
                let html = '';
                if (data.predictions) {
                    html += '<h3>Top Predictions</h3><ul>';
                    for (const p of data.predictions) {
                        html += `<li><strong>${p.sector}</strong> — ${ (p.score*100).toFixed(1) }%</li>`;
                    }
                    html += '</ul>';
                }

                if (data.neighbors) {
                    html += '<h3>Nearest Training Examples</h3><div style="display:flex;gap:12px;flex-wrap:wrap">';
                    for (const n of data.neighbors) {
                        html += '<div style="width:160px;text-align:center">';
                        if (n.thumbnail) html += `<img src="${n.thumbnail}" style="width:160px;height:160px;object-fit:cover;border-radius:8px;display:block;margin:0 auto 8px;">`;
                        html += `<div style="font-size:0.9rem">${n.sector}</div>`;
                        html += `<div style="color:#666;font-size:0.8rem">dist ${(n.distance).toFixed(3)}</div>`;
                        html += '</div>';
                    }
                    html += '</div>';
                }

                results.innerHTML = html;
            }
        </script>
    </body>
</html>
